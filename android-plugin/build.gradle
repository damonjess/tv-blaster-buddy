apply plugin: 'com.android.library'

android {
    namespace "app.lovable.tvoff.plugin"
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    sourceSets {
        main {
            java.srcDirs = ['.']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation "com.getcapacitor:android:6.1.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}

repositories {
    google()
    mavenCentral()
}
